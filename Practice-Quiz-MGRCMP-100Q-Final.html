: "Excel Tools & Concepts", "q": "The requirement is: <b>Select contiguous data down / across.</b><br><br>Which function / Excel feature best matches this requirement?", "opts": ["Ctrl+Shift+Down / Left", "Data Consolidation", "F4", "Macros"], "ans": 0, "exp": "<b>Ctrl+Shift+Down / Left</b> is the intended item here. Select contiguous data down / across. Syntax/path: <code>Keyboard</code>", "hard": false, "coverage": "Ctrl+Shift+Down / Left"}, {"topic": "Errors & Traps", "q": "Cell A2=125 and B2=0. What is the result of <code>=A2/B2</code>?", "opts": ["#DIV/0!", "#VALUE!", "#N/A", "0"], "ans": 0, "exp": "Division by zero returns #DIV/0!.", "hard": true, "coverage": "IFERROR"}, {"topic": "Errors & Traps", "q": "A formula explicitly references a cell that has been deleted and now reads <code>=#REF!*2</code>. What is the result?", "opts": ["#REF!", "#VALUE!", "#NAME?", "0"], "ans": 0, "exp": "An invalid/deleted reference propagates #REF!.", "hard": true, "coverage": ["SUM", "MAX"]}, {"topic": "Errors & Traps", "q": "What is the result of <code>=SQRT(-9)</code> in ordinary Excel real-number functions?", "opts": ["#NUM!", "#VALUE!", "#DIV/0!", "3"], "ans": 0, "exp": "SQRT of a negative real input returns #NUM!.", "hard": true, "coverage": "MMULT"}, {"topic": "Errors & Traps", "q": "A2:A20 has 19 rows, while the FILTER include range B2:B18 has 17 rows. What is the result of <code>=FILTER(A2:A20,B2:B18=\"N\")</code>?", "opts": ["#VALUE!", "#SPILL!", "#CALC!", "#N/A"], "ans": 0, "exp": "FILTER's array and include dimensions do not align, producing #VALUE!.", "hard": true, "coverage": "Advanced Filter"}, {"topic": "Errors & Traps", "q": "<code>=SORT(A2:D10,4,-1)</code> needs to spill into G2:J10, but G3 contains existing data. What appears in the formula cell?", "opts": ["#SPILL!", "#VALUE!", "#REF!", "#CALC!"], "ans": 0, "exp": "Existing content blocks the dynamic-array spill range, so #SPILL! appears.", "hard": true, "coverage": "2D Data Table"}];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildBank(){
 return shuffle(source.map(x=>{
   const opts=x.opts.map((label,i)=>({label,correct:i===x.ans}));
   shuffle(opts);
   return {...x,opts,ans:opts.findIndex(o=>o.correct)}
 }));
}
const bank=buildBank();
let answers=Array(bank.length).fill(null),locked=Array(bank.length).fill(false),perQ=Array(bank.length).fill(0),visibleStart=Array(bank.length).fill(null);
let started=performance.now(),submitted=false;

function fmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
setInterval(()=>{if(!submitted)document.getElementById('watch').textContent=fmt(performance.now()-started)},250);

function render(){
 const root=document.getElementById('quiz');root.innerHTML='';
 bank.forEach((x,i)=>{
   const sec=document.createElement('section');sec.className='q';sec.dataset.i=i;
   sec.innerHTML=`<div class="qtext"><b>Q${i+1}.</b> ${x.q}</div><div class="opts"></div><div class="exp" id="exp${i}"></div>`;
   const box=sec.querySelector('.opts');
   x.opts.forEach((o,j)=>{
     const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o.label}`;
     if(locked[i]){b.disabled=true;if(j===x.ans)b.classList.add('good');if(answers[i]===j&&j!==x.ans)b.classList.add('bad')}
     b.onclick=()=>choose(i,j);box.appendChild(b)
   });
   const e=sec.querySelector('.exp');
   if(locked[i]){const ok=answers[i]===x.ans;e.className='exp show';e.innerHTML=`<b>${ok?'Correct':'Incorrect'}.</b> Correct answer: <b>${String.fromCharCode(65+x.ans)}. ${x.opts[x.ans].label}</b><br><br>${x.exp}`}
   root.appendChild(sec)
 });
 updateBar();
 observeQuestions();
}
function choose(i,j){
 if(locked[i]||submitted)return;
 const now=performance.now();
 if(visibleStart[i]!==null)perQ[i]+=now-visibleStart[i];
 answers[i]=j;locked[i]=true;
 const sec=document.querySelector(`.q[data-i="${i}"]`);
 sec.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===bank[i].ans)b.classList.add('good');if(k===j&&k!==bank[i].ans)b.classList.add('bad')});
 const e=sec.querySelector('.exp');const ok=j===bank[i].ans;e.className='exp show';e.innerHTML=`<b>${ok?'Correct':'Incorrect'}.</b> Correct answer: <b>${String.fromCharCode(65+bank[i].ans)}. ${bank[i].opts[bank[i].ans].label}</b><br><br>${bank[i].exp}`;
 updateBar();
}
function updateBar(){document.getElementById('bar').style.width=(answers.filter(a=>a!==null).length/bank.length*100)+'%'}
let observer;
function observeQuestions(){
 if(observer)observer.disconnect();
 observer=new IntersectionObserver(entries=>{
   const now=performance.now();
   entries.forEach(en=>{const i=Number(en.target.dataset.i);if(en.isIntersecting){if(visibleStart[i]===null&&!locked[i])visibleStart[i]=now}else{if(visibleStart[i]!==null&&!locked[i]){perQ[i]+=now-visibleStart[i];visibleStart[i]=null}}})
 },{threshold:.45});
 document.querySelectorAll('.q').forEach(el=>observer.observe(el));
}

 answers.forEach((a,i)=>{if(a!==null){attempt++;if(a===bank[i].ans)correct++;else wrong++}});

 const topic={};
 bank.forEach((x,i)=>{if(!topic[x.topic])topic[x.topic]={a:0,c:0,t:0};if(answers[i]!==null){topic[x.topic].a++;topic[x.topic].t+=perQ[i];if(answers[i]===x.ans)topic[x.topic].c++}});
 const rows=Object.entries(topic).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<tr><td>${k}</td><td>${v.a}</td><td>${v.c}</td><td>${(v.a?100*v.c/v.a:0).toFixed(1)}%</td><td>${fmt(v.a?v.t/v.a:0)}</td></tr>`).join('');
 const hard=bank.map((x,i)=>x.hard?i:-1).filter(i=>i>=0),ha=hard.filter(i=>answers[i]!==null).length,hc=hard.filter(i=>answers[i]===bank[i].ans).length;
 const er=bank.map((x,i)=>x.topic==="Errors & Traps"?i:-1).filter(i=>i>=0),ea=er.filter(i=>answers[i]!==null).length,ec=er.filter(i=>answers[i]===bank[i].ans).length;
 document.querySelector('.top').classList.add('hidden');document.querySelector('.progress').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');
 const r=document.getElementById('results');r.classList.add('active');
 r.innerHTML=`<div class="hero"><div class="big">${score.toFixed(2)} / ${bank.length}</div><div class="stats">

 </div></div><h2>Topic-wise performance</h2><table><thead><tr><th>Topic</th><th>Attempted</th><th>Correct</th><th>Accuracy</th><th>Avg time</th></tr></thead><tbody>${rows}</tbody></table>
 `;
 window.scrollTo({top:0,behavior:'smooth'});
};
render();
